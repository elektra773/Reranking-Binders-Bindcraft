# Copy this file, edit the values, then run:
#   ./run_binder_ipsae.sh my_run.conf

# Optional: load a shared Boltz module before running.
BOLTZ_MODULE_NAME="boltz"

# Use one of: prepare, predict-and-score, score-batch
MODE="predict-and-score"

# Python used to launch binder_ipsae_pipeline.py
PYTHON_BIN="python3"

# Required for prepare / predict-and-score
TARGET_PDB="/home/elektrat/Desktop/RerankingBinders/EC1-2/EC1.pdb"
TARGET_PDB_CHAIN="A"
TARGET_CHAIN_ID="A"
TARGET_NAME="CDH23_EC1"
TARGET_CALCIUM_IONS="3"

# Leave blank to let Boltz generate MSAs via --use-msa-server.
TARGET_MSA=""
BINDER_MSA=""
FORCE_EMPTY_MSA="0"

# Pick one binder input style.
BINDER_CSV="/home/elektrat/Desktop/RerankingBinders/EC1-2/final_design_stats.csv"
BINDER_FASTA=""
BINDER_SEQUENCE=""
BINDER_NAME="testbinder1"

# BindCraft CSV defaults
BINDER_NAME_COLUMN="Design"
BINDER_SEQUENCE_COLUMN="Sequence"
BINDER_RANK_COLUMN="Rank"
BINDER_CHAIN_ID="B"

# Output locations
WORK_DIR="/home/elektrat/Desktop/RerankingBinders/run_full_ec1"
SUMMARY_CSV="/home/elektrat/Desktop/RerankingBinders/run_full_ec1/ipsae_summary.csv"
LOG_FILE="/home/elektrat/Desktop/RerankingBinders/run_full_ec1/run.log"

# Prediction options
USE_MSA_SERVER="1"
USE_POTENTIALS="1"
OVERRIDE="0"
DEVICES="1"
RECYCLING_STEPS=""
DIFFUSION_SAMPLES=""

# Scoring options
PAE_CUTOFF="15"
DIST_CUTOFF="15"

# Only needed for MODE=score-batch
PREDICTIONS_ROOT=""
